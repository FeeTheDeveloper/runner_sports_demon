name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes sqlite3
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run contracts:validate
      # Evidence audit (static checks; build/test already ran above). Non-strict until the
      # known FAIL rows in .runner/audit/LATEST_AUDIT.md are resolved; then add --strict.
      - run: npm run audit -- --skip-exec
